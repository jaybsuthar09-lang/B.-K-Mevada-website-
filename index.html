<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B.K. Mevada Machines</title>

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  color-scheme:light;
  --paper:#E9ECEF;
  --surface:#FFFFFF;
  --ink:#212A32;
  --muted:#59646F;
  --rule:#CFD5DB;
  --red:#B3201F;
}

/* DARK MODE */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111519;
    --surface:#1A2026;
    --ink:#E7EAED;
  }
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial, sans-serif;
}

/* HEADER */
.masthead{
  background:#fff;
  border-bottom:3px solid var(--red);
}

.masthead-in{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
}

/* GRID */
.wall{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--rule);
}

.wall li{
  list-style:none;
}

.wall a{
  display:block;
  background:#fff;
  text-decoration:none;
  color:#000;
}

.wall .ph{
  position:relative;
  aspect-ratio:1/1;
}

.wall .ph img{
  position:absolute;
  inset:10px;
  width:calc(100% - 20px);
  height:calc(100% - 20px);
  object-fit:contain;

  /* 🔥 FIX: REMOVE GREYSCALE */
  filter: none !important;
  -webkit-filter: none !important;
  opacity: 1 !important;
  mix-blend-mode: normal !important;
}

.wall .nm{
  padding:10px;
  font-weight:bold;
  text-align:center;
}

/* PRODUCT SECTION */
.machine{
  max-width:900px;
  margin:30px auto;
  background:var(--surface);
}

.photo{
  padding:15px;
  text-align:center;
}

.photo img{
  max-width:100%;
  max-height:300px;

  /* 🔥 FIX AGAIN */
  filter: none !important;
  -webkit-filter: none !important;
  opacity: 1 !important;
  mix-blend-mode: normal !important;
}

/* GLOBAL SAFETY */
img{
  filter:none !important;
  -webkit-filter:none !important;
}
</style>
</head>

<body>

<header class="masthead">
  <div class="masthead-in">
    <h2>B.K. Mevada Engineers</h2>
  </div>
</header>

<main>

<!-- GRID -->
<ul class="wall">

<li>
<a href="#">
<div class="ph">
<img src="https://via.placeholder.com/300x300.png?text=Thickness+Machine">
</div>
<div class="nm">Thickness Machine</div>
</a>
</li>

<li>
<a href="#">
<div class="ph">
<img src="https://via.placeholder.com/300x300.png?text=Surface+Machine">
</div>
<div class="nm">Surface Machine</div>
</a>
</li>

<li>
<a href="#">
<div class="ph">
<img src="https://via.placeholder.com/300x300.png?text=Planner">
</div>
<div class="nm">Planner</div>
</a>
</li>

</ul>

<!-- PRODUCT DETAIL -->
<section class="machine">
<div class="photo">
<img src="https://via.placeholder.com/400x300.png?text=Thickness+With+Surface">
</div>
</section>

</main>

</body>
</html>
