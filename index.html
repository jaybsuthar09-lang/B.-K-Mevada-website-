<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machines – B.K. Mevada</title>

<style>
body{margin:0;font-family:Arial}
.masthead{background:#fff;border-bottom:3px solid #B3201F}
.masthead-in{display:flex;justify-content:space-between;padding:10px 16px}
.call{
  border:2px solid #B3201F;
  padding:10px 15px;
  text-decoration:none;
  color:#B3201F;
  font-weight:bold;
}
.call:hover{background:#B3201F;color:#fff}

.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}
.wall a{
  display:block;
  text-decoration:none;
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="masthead">
  <div class="masthead-in">
    <h2>B.K. Mevada</h2>

    <!-- ✅ WhatsApp Button -->
    <a class="call" href="https://wa.me/919825137814" target="_blank">
      WhatsApp
    </a>
  </div>
</header>

<!-- MACHINE GRID -->
<ul class="wall">

<li>
<a href="#" class="machine-link" data-name="Panel Saw Machine" data-model="PS-100">
  Panel Saw
</a>
</li>

<li>
<a href="#" class="machine-link" data-name="Edge Bander Machine" data-model="EB-200">
  Edge Bander
</a>
</li>

<li>
<a href="#" class="machine-link" data-name="CNC Router Machine" data-model="CNC-500">
  CNC Router
</a>
</li>

<li>
<a href="#" class="machine-link" data-name="Cold Press Machine" data-model="CP-300">
  Cold Press
</a>
</li>

<li>
<a href="#" class="machine-link" data-name="Planner Machine" data-model="PL-150">
  Planner
</a>
</li>

<li>
<a href="#" class="machine-link" data-name="Mortiser Machine" data-model="MT-250">
  Mortiser
</a>
</li>

</ul>

<!-- ✅ WHATSAPP SCRIPT -->
<script>
document.querySelectorAll(".machine-link").forEach(link => {
  link.addEventListener("click", function(e) {
    e.preventDefault();

    let name = this.getAttribute("data-name");
    let model = this.getAttribute("data-model");

    let message = `Hello, I saw your machine at Mumbai Wood 2026.

Machine: ${name}
Model: ${model}

Please share full details, price and demo.`;

    let phone = "919825137814";
    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
  });
});
</script>

</body>
</html>
