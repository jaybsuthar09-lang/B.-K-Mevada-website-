<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B.K. Mevada Engineers</title>

<style>
body{margin:0;font-family:Arial}

/* HEADER */
.masthead{background:#fff;border-bottom:3px solid #B3201F}
.masthead-in{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}

.call{
  border:2px solid #B3201F;
  padding:10px 15px;
  text-decoration:none;
  color:#B3201F;
  font-weight:bold;
}
.call:hover{background:#B3201F;color:#fff}

/* PRODUCT GRID */
.wall{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:20px;
  list-style:none;
}

.wall a{
  display:block;
  border:1px solid #ccc;
  padding:10px;
  text-decoration:none;
  color:#000;
  text-align:center;
  transition:0.3s;
}

.wall a:hover{
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.ph img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.nm{
  display:block;
  margin-top:8px;
  font-weight:bold;
}

/* QUOTATION SECTION */
.quote-box{
  padding:25px;
  text-align:center;
  background:#f8f8f8;
  border-top:2px solid #ccc;
}

.quote-box select{
  padding:10px;
  width:260px;
  margin-bottom:10px;
}

.quote-box button{
  padding:12px 22px;
  background:#25D366;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
  border-radius:5px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="masthead">
  <div class="masthead-in">
    <h2>B.K. Mevada Engineers</h2>

    <a class="call" href="https://wa.me/919825137814" target="_blank">
      WhatsApp
    </a>
  </div>
</header>

<!-- PRODUCT CATALOGUE -->
<ul class="wall">

<li>
  <a href="#">
    <span class="ph"><img src="images/panelsaw.jpg"></span>
    <span class="nm">Panel Saw Machine</span>
  </a>
</li>

<li>
  <a href="#">
    <span class="ph"><img src="images/edgebander.jpg"></span>
    <span class="nm">Edge Bander Machine</span>
  </a>
</li>

<li>
  <a href="#">
    <span class="ph"><img src="images/cnc.jpg"></span>
    <span class="nm">CNC Router Machine</span>
  </a>
</li>

<li>
  <a href="#">
    <span class="ph"><img src="images/press.jpg"></span>
    <span class="nm">Cold Press Machine</span>
  </a>
</li>

<li>
  <a href="#">
    <span class="ph"><img src="images/planner.jpg"></span>
    <span class="nm">Planner Machine</span>
  </a>
</li>

<li>
  <a href="#">
    <span class="ph"><img src="images/mortiser.jpg"></span>
    <span class="nm">Mortiser Machine</span>
  </a>
</li>

</ul>

<!-- PRODUCT CLICK → WHATSAPP -->
<script>
document.querySelectorAll(".wall a").forEach(link => {
  link.addEventListener("click", function(e) {

    e.preventDefault();

    let name = this.querySelector(".nm")?.innerText || "Machine";

    let message = `Hello, I visited your stall at Mumbai Wood 2026.

Machine: ${name}

Please share full details, price and demo.`;

    let phone = "919825137814";
    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
  });
});
</script>

<!-- QUOTATION SECTION -->
<div class="quote-box">

  <h3>Request a Quotation</h3>

  <select id="machineSelect">
    <option value="">Select Machine</option>

    <option value="Panel Saw Machine (PS-100)">Panel Saw Machine (PS-100)</option>
    <option value="Edge Bander Machine (EB-200)">Edge Bander Machine (EB-200)</option>
    <option value="CNC Router Machine (CNC-500)">CNC Router Machine (CNC-500)</option>
    <option value="Cold Press Machine (CP-300)">Cold Press Machine (CP-300)</option>
    <option value="Planner Machine (PL-150)">Planner Machine (PL-150)</option>
    <option value="Mortiser Machine (MT-250)">Mortiser Machine (MT-250)</option>

  </select>

  <br>

  <button onclick="sendWhatsApp()">
    Get Quotation on WhatsApp
  </button>

</div>

<!-- DROPDOWN → WHATSAPP -->
<script>
function sendWhatsApp() {

  let selectedMachine = document.getElementById("machineSelect").value;

  if (selectedMachine === "") {
    alert("Please select a machine first");
    return;
  }

  let message = `Hello, I visited your stall at Mumbai Wood 2026.

I would like a quotation for:

${selectedMachine}

Please share:
• Price
• Full specifications
• Demo availability
• Delivery time`;

  let phone = "919825137814";
  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>

</body>
</html>
